# The factory's Review task (docs/factory/README.md).
#
# A fresh-context, two-axis review (Spec, Standards) of every ready pull
# request from an agent branch (adw/*). It posts its reports on the PR. On a
# Spec blocker it labels the PR `rework` and counts the round with
# `rework:1`..`rework:3`; the blocker after rework:3 labels it ready-for-human
# and the factory stops. It never approves and never merges.
#
# Draft PRs are skipped: a Ticket run pushes a commit per phase to its draft PR
# and marks it ready when it finishes, so reviewing drafts would review
# half-built work and spend the rework rounds on it.
#
# Three steps keep the agent away from GitHub: `prepare` and `apply` hold the
# App token and run no agent; `review` runs the agent with the Anthropic key
# only, no shell, no write tools and a dollar cap.
#
# No `|| true` anywhere, on purpose. A step that cannot do its job fails the
# run, so a red run says the brake did not engage and a green one says it did.

name: Review

# pull_request_target, not pull_request: the workflow file and the harness
# always come from the base branch, so a PR cannot rewrite the brake that
# judges it. The PR's code is checked out under pr/ as data and never run.
on:
  pull_request_target:
    types: [ready_for_review, synchronize, reopened]

permissions: {}

concurrency:
  # One review running and at most one pending per PR, and a review in flight
  # is never cancelled. Events the job skips (drafts, other branches) get a
  # throwaway group of their own so they can never displace a pending review.
  # Keep this condition identical to the job's `if:` below.
  group: >-
    ${{
      (github.event.pull_request.draft == false
        && startsWith(github.event.pull_request.head.ref, 'adw/')
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        && !contains(github.event.pull_request.labels.*.name, 'ready-for-human'))
      && format('review-{0}', github.event.pull_request.number)
      || format('review-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.317"

jobs:
  review:
    # Ready (not draft) PRs, from an adw/* branch of this repo (never a fork),
    # opened by a collaborator, and not yet handed to a human.
    if: >-
      github.event.pull_request.draft == false
      && startsWith(github.event.pull_request.head.ref, 'adw/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      && !contains(github.event.pull_request.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the daily run cap counts this workflow's runs
    steps:
      # The harness that runs the review comes from the base branch, so a PR
      # cannot change the code judging it. The PR's own code goes under pr/.
      # Fork PRs never get here (the job's `if:`), so no fork code is fetched.
      - name: Check out the harness (base branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Preflight (configuration, daily cap, App token)
        id: preflight
        uses: ./.github/actions/factory-preflight
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          daily-run-cap: ${{ vars.FACTORY_DAILY_RUN_CAP || '20' }}

      - name: Check out the pull request (read by the reviewer, never run)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Gather the diff, the Ticket and its Spec
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run adws/actions/review_pr.py prepare --repo "$REPO" --pr "$PR"
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --code-dir pr --out review-out

      - name: Review (fresh context, read-only, budget-capped)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.FACTORY_REVIEW_MODEL || 'sonnet' }}
          BUDGET_USD: ${{ vars.FACTORY_REVIEW_BUDGET_USD || '2' }}
        run: >-
          uv run adws/actions/review_pr.py review --out review-out
          --model "$MODEL" --max-budget-usd "$BUDGET_USD"

      - name: Post the reports and move the labels
        env:
          GH_TOKEN: ${{ steps.preflight.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run adws/actions/review_pr.py apply --repo "$REPO" --pr "$PR" --out review-out

      - name: Keep the review's files with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-pr${{ github.event.pull_request.number }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: review-out/
          if-no-files-found: ignore
