openapi: 3.0.3
info:
  title: GrowBuddy v2 API
  description: |
    Comprehensive API for GrowBuddy v2 - a plant care and garden planning application.

    ## Authentication
    Most endpoints require JWT authentication via:
    - `Authorization: Bearer <token>` header, or
    - `accessToken` HTTP-only cookie

    Obtain tokens via `/api/auth/signup` or `/api/auth/login` endpoints.

    ## Features
    - **Plant Management**: Track indoor/outdoor plants with care schedules
    - **Plant Database**: Browse 100+ plant profiles with growing information
    - **Garden Planner**: Design garden layouts with plot management
    - **AI Analysis**: Get AI-powered companion planting recommendations
    - **Layout Generation**: Generate optimized garden layouts automatically
    - **Community Q&A**: Ask and answer gardening questions
    - **Care Tracking**: Log watering, fertilizing, and other care actions
    - **Journal**: Document plant growth and observations
    - **Recommendations**: Receive personalized plant care suggestions
    - **Notifications**: Real-time updates via WebSocket

    ## Rate Limits
    - AI garden analysis: Limited to 3 per day per user (configurable)
    - Additional analyses can be granted by administrators

    ## WebSocket Support
    Real-time notifications delivered via WebSocket at `/ws`

  version: 2.0.0
  contact:
    name: GrowBuddy Support
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://api.example.com/api
    description: Production server (placeholder)

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Plants
    description: User's plant collection management
  - name: Plant Profiles
    description: Browse plant database with care information
  - name: Zones
    description: Growing zone detection and management
  - name: Care History
    description: Track plant care actions (watering, fertilizing, etc.)
  - name: Journal
    description: Plant growth journal and observations
  - name: Questions
    description: Community Q&A for gardening questions
  - name: Answers
    description: Answer community questions and vote
  - name: Gardens
    description: Garden planning with plots and AI analysis
  - name: Recommendations
    description: Personalized plant care recommendations
  - name: Companions
    description: Companion planting relationships
  - name: AI Tasks
    description: Asynchronous AI task queue management
  - name: Notifications
    description: User notifications and alerts
  - name: Admin
    description: Administrative endpoints for user management
  - name: Analysis Usage
    description: Track AI analysis usage limits

