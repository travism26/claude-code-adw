paths:
  /companions:
    get:
      tags:
        - Companions
      summary: List all companion relationships
      description: |
        Retrieve all companion planting relationships in the system.
        Returns relationships sorted by type (beneficial/harmful) and creation date.
      operationId: listAllCompanions
      responses:
        '200':
          description: Companion relationships retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '../schemas/models.yaml#/components/schemas/PlantCompanion'
                    - type: object
                      properties:
                        plantA:
                          type: object
                          properties:
                            id:
                              $ref: '../schemas/common.yaml#/components/schemas/UUID'
                            common_name:
                              type: string
                            species:
                              type: string
                        plantB:
                          type: object
                          properties:
                            id:
                              $ref: '../schemas/common.yaml#/components/schemas/UUID'
                            common_name:
                              type: string
                            species:
                              type: string
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

    post:
      tags:
        - Companions
      summary: Create companion relationship
      description: |
        Create a new companion planting relationship between two plant profiles.
        Requires authentication. In production, this should be restricted to admin users.
      operationId: createCompanion
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plant_a_id
                - plant_b_id
                - relationship
              properties:
                plant_a_id:
                  $ref: '../schemas/common.yaml#/components/schemas/UUID'
                  description: First plant profile ID
                plant_b_id:
                  $ref: '../schemas/common.yaml#/components/schemas/UUID'
                  description: Second plant profile ID
                relationship:
                  type: string
                  enum: [beneficial, harmful]
                  description: Type of companion relationship
                  example: "beneficial"
                notes:
                  type: string
                  nullable: true
                  description: Optional notes about the relationship
                  example: "Tomatoes and basil are mutually beneficial companions"
      responses:
        '201':
          description: Companion relationship created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/models.yaml#/components/schemas/PlantCompanion'
                  - type: object
                    properties:
                      plantA:
                        type: object
                        properties:
                          id:
                            $ref: '../schemas/common.yaml#/components/schemas/UUID'
                          common_name:
                            type: string
                          species:
                            type: string
                      plantB:
                        type: object
                        properties:
                          id:
                            $ref: '../schemas/common.yaml#/components/schemas/UUID'
                          common_name:
                            type: string
                          species:
                            type: string
        '400':
          description: Bad request - validation error or relationship already exists
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/Error'
              examples:
                alreadyExists:
                  value:
                    error: "This companion relationship already exists"
                validation:
                  value:
                    errors:
                      - msg: "Relationship must be either beneficial or harmful"
                        param: "relationship"
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '404':
          description: One or both plant profiles not found
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/Error'
              example:
                error: "One or both plant profiles not found"
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /companions/{plantProfileId}:
    get:
      tags:
        - Companions
      summary: Get companions for a plant
      description: |
        Retrieve all companion relationships for a specific plant profile.
        Returns companions organized into beneficial and harmful categories.
      operationId: getCompanionsForPlant
      parameters:
        - name: plantProfileId
          in: path
          required: true
          description: Plant profile ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Companions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  plant:
                    type: object
                    description: The plant profile being queried
                    properties:
                      id:
                        $ref: '../schemas/common.yaml#/components/schemas/UUID'
                      common_name:
                        type: string
                      species:
                        type: string
                  beneficial:
                    type: array
                    description: Plants that are beneficial companions
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../schemas/common.yaml#/components/schemas/UUID'
                        plant:
                          type: object
                          properties:
                            id:
                              $ref: '../schemas/common.yaml#/components/schemas/UUID'
                            common_name:
                              type: string
                            species:
                              type: string
                        notes:
                          type: string
                          nullable: true
                  harmful:
                    type: array
                    description: Plants that should not be planted together
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../schemas/common.yaml#/components/schemas/UUID'
                        plant:
                          type: object
                          properties:
                            id:
                              $ref: '../schemas/common.yaml#/components/schemas/UUID'
                            common_name:
                              type: string
                            species:
                              type: string
                        notes:
                          type: string
                          nullable: true
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '404':
          description: Plant profile not found
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/Error'
              example:
                error: "Plant profile not found"
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /companions/{id}:
    delete:
      tags:
        - Companions
      summary: Delete companion relationship
      description: |
        Delete a companion planting relationship.
        Requires authentication. In production, this should be restricted to admin users.
      operationId: deleteCompanion
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Companion relationship ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Companion relationship deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Companion relationship deleted successfully"
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '404':
          description: Companion relationship not found
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/Error'
              example:
                error: "Companion relationship not found"
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'
