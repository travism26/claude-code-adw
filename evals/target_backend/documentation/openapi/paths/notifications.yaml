paths:
  /notifications:
    get:
      tags:
        - Notifications
      summary: List user notifications
      description: Fetch all notifications for the authenticated user with optional filtering.
      operationId: listNotifications
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: unreadOnly
          in: query
          description: Filter to show only unread notifications
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of notifications to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '../schemas/models.yaml#/components/schemas/Notification'
                  count:
                    type: integer
                    description: Number of notifications returned
                    example: 5
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread notification count
      description: Get the count of unread notifications for the authenticated user.
      operationId: getUnreadCount
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of unread notifications
                    example: 3
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /notifications/mark-all-read:
    patch:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Mark all notifications as read for the authenticated user.
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "All notifications marked as read"
                  count:
                    type: integer
                    description: Number of notifications marked as read
                    example: 7
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /notifications/test:
    post:
      tags:
        - Notifications
      summary: Create test notification
      description: Create a test notification for development purposes.
      operationId: createTestNotification
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: Notification message
                  example: "This is a test notification"
                link:
                  type: string
                  maxLength: 500
                  description: Optional link/route
                  example: "/gardens/123"
                type:
                  type: string
                  enum: [info, success, warning, error]
                  default: info
                  description: Notification type
                  example: "info"
      responses:
        '201':
          description: Test notification created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Test notification created successfully"
                  notification:
                    $ref: '../schemas/models.yaml#/components/schemas/Notification'
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Get notification by ID
      description: Fetch a single notification by ID. User must own the notification.
      operationId: getNotification
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Notification retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification:
                    $ref: '../schemas/models.yaml#/components/schemas/Notification'
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

    delete:
      tags:
        - Notifications
      summary: Delete notification
      description: Delete a notification. User must own the notification.
      operationId: deleteNotification
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Notification deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Notification deleted successfully"
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a specific notification as read. User must own the notification.
      operationId: markNotificationRead
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Notification marked as read"
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'
