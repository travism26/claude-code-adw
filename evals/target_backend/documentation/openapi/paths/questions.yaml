paths:
  /questions:
    get:
      tags:
        - Questions
      summary: List questions
      description: |
        Retrieve questions with pagination and optional filtering.
        Supports filtering by tag and searching in title and body.
        Returns questions sorted by creation date (newest first).
      operationId: listQuestions
      parameters:
        - $ref: '../schemas/common.yaml#/components/parameters/PageParam'
        - $ref: '../schemas/common.yaml#/components/parameters/LimitParam'
        - name: tag
          in: query
          description: Filter questions by tag
          schema:
            type: string
            example: "tomatoes"
        - name: search
          in: query
          description: Search in question title and body
          schema:
            type: string
            example: "yellow leaves"
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../schemas/common.yaml#/components/schemas/UUID'
                        title:
                          type: string
                          example: "Why are my tomato leaves turning yellow?"
                        body:
                          type: string
                          example: "I've noticed yellow spots on the lower leaves"
                        tags:
                          type: array
                          items:
                            type: string
                          example: ["tomatoes", "disease"]
                        author:
                          type: object
                          properties:
                            id:
                              $ref: '../schemas/common.yaml#/components/schemas/UUID'
                            email:
                              type: string
                              format: email
                        answerCount:
                          type: integer
                          example: 3
                        created_at:
                          $ref: '../schemas/common.yaml#/components/schemas/Timestamp'
                        updated_at:
                          $ref: '../schemas/common.yaml#/components/schemas/Timestamp'
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/Pagination'
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

    post:
      tags:
        - Questions
      summary: Create a question
      description: Create a new question. User must be authenticated.
      operationId: createQuestion
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Question title
                  example: "Why are my tomato leaves turning yellow?"
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Detailed question text
                  example: "I've noticed yellow spots on the lower leaves of my tomato plants. What could be causing this?"
                tags:
                  type: array
                  maxItems: 10
                  description: Optional tags for categorization
                  items:
                    type: string
                    maxLength: 50
                  example: ["tomatoes", "disease", "troubleshooting"]
      responses:
        '201':
          description: Question created successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/models.yaml#/components/schemas/Question'
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

  /questions/{id}:
    get:
      tags:
        - Questions
      summary: Get question by ID
      description: Retrieve a specific question with all its answers. Answers are sorted by upvotes (highest first).
      operationId: getQuestion
      parameters:
        - name: id
          in: path
          required: true
          description: Question ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Question retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/models.yaml#/components/schemas/Question'
                  - type: object
                    properties:
                      author:
                        type: object
                        properties:
                          id:
                            $ref: '../schemas/common.yaml#/components/schemas/UUID'
                          email:
                            type: string
                            format: email
                      answers:
                        type: array
                        items:
                          allOf:
                            - $ref: '../schemas/models.yaml#/components/schemas/Answer'
                            - type: object
                              properties:
                                author:
                                  type: object
                                  properties:
                                    id:
                                      $ref: '../schemas/common.yaml#/components/schemas/UUID'
                                    email:
                                      type: string
                                      format: email
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

    put:
      tags:
        - Questions
      summary: Update question
      description: Update a question. User must be the author. All fields are optional.
      operationId: updateQuestion
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Question ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Updated question title"
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  example: "Updated question body with more details"
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 50
                  example: ["tomatoes", "disease"]
      responses:
        '200':
          description: Question updated successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/models.yaml#/components/schemas/Question'
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../schemas/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'

    delete:
      tags:
        - Questions
      summary: Delete question
      description: Delete a question. User must be the author. This action cannot be undone.
      operationId: deleteQuestion
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Question ID
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: Question deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Question deleted successfully"
        '400':
          $ref: '../schemas/common.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../schemas/common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../schemas/common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../schemas/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../schemas/common.yaml#/components/responses/InternalServerError'
