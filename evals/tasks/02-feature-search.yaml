id: 02-feature-search
plan_type: feature
prompt: >
  Add a `search <term>` CLI command to the notes app that lists all notes
  whose title or body contains the term, case-insensitively. Print matches
  in the same one-line format as `list`. Print "No matches." and exit 0 when
  nothing matches. Keep all existing commands working and add pytest coverage
  for title match, body match, case-insensitivity, and the no-match case.
test_command: "uv run pytest -q"
acceptance:
  - "rm -f /tmp/eval02.json && uv run python -m app.notes --db /tmp/eval02.json add 'Grocery list' --body 'milk and eggs' >/dev/null && uv run python -m app.notes --db /tmp/eval02.json search GROCERY | grep -qi 'grocery'"
  - "uv run python -m app.notes --db /tmp/eval02.json search milk | grep -qi 'grocery'"
  - "uv run python -m app.notes --db /tmp/eval02.json search zzz | grep -q 'No matches.'"
judge_focus: "case-insensitive matching over title+body and consistent list output format"
